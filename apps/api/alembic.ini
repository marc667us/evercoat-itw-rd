# Alembic — schema version control.
#
# The connection URL is NOT set here. It comes from app.core.config at
# runtime (see migrations_alembic/env.py), because a URL in a committed
# ini file is both a secret leak and a way to run a migration against the
# wrong database by forgetting to override it.

[alembic]
script_location = migrations_alembic

# Timestamped, readable filenames: 2026_08_16_1432-a1b2c3_add_x.py.
# The default is a bare hash, which makes `ls` useless for working out
# what ran when.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# Long enough to read at a glance in a filename.
truncate_slug_length = 60

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
