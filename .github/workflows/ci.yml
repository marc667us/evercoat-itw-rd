name: CI

# All logic lives in scripts/ so the runner stays swappable (ADR-010).
# The source's zero-cost default is Forgejo Actions; GitHub is used as a
# permitted convenience, and moving back means changing this file only.

on:
  push:
    # `master` FIRST because that is this repository's actual default
    # branch. This said `[main]` only, so every push since the repository
    # was created matched nothing and CI never ran once — a workflow
    # gated on a branch that does not exist is indistinguishable from
    # having no CI at all, and it reports nothing while it happens.
    # `main` is kept so a future default-branch rename does not silently
    # switch CI off again.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref. Note that a GitHub concurrency group is a one-slot
  # replacement waiting room, not a queue -- a pending run can be evicted
  # rather than queued. That is fine for CI; it is NOT fine for deploy or
  # migration workflows, which must confirm their run id actually started.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: API — lint, type, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, matching the compose stack. Testing against plain
        # postgres would pass and then fail at Slice 8 when the extension
        # is needed (ADR-004).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evercoat_itw_rd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d evercoat_itw_rd"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, resolved 2026-08-18
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check . && ruff format --check .

      - name: Type check
        working-directory: apps/api
        run: mypy app

      - name: Apply migrations
        working-directory: apps/api
        env:
          # The OWNER role, not the runtime role. ADR-017 keeps DDL away
          # from the role the application connects with, so these two
          # URLs are deliberately different credentials.
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
        run: |
          set -euo pipefail
          # Alembic, not a loop over *.sql. The loop applied files in
          # glob order with no record of what had run -- acceptable on a
          # throwaway CI database, useless anywhere the schema persists.
          alembic upgrade head
          # Prove version tracking works rather than assume it. A second
          # run must be a no-op; if it re-applies, the version table is
          # not being written and every future deploy would replay the
          # entire history.
          out=$(alembic upgrade head 2>&1)
          if echo "$out" | grep -q "Running upgrade"; then
            echo "alembic re-applied migrations on a second run:"
            echo "$out"
            exit 1
          fi
          alembic current

      - name: Grant the test roles a login
        env:
          PGPASSWORD: ci-postgres
        run: |
          set -euo pipefail
          # LOGIN and a password are the ONLY things this step may do.
          #
          # It used to also grant privileges and reassign table ownership
          # for `core, projects, audit`. That list was wrong -- it omitted
          # `innovation` and `workflow` -- so the first CI run that ever
          # executed failed 37 tests with 50 `permission denied` errors
          # while the same suite passed 152/0/0 locally, because the local
          # database had been repaired by hand with a DIFFERENT list.
          #
          # Two hand-maintained lists in two files, which nothing can check
          # against each other, is this platform's most repeated defect.
          # Ownership and grants now belong to migration 014 and are
          # asserted by tests/db/test_object_ownership.py, so there is one
          # decider and a test that fails if a new table misses it.
          #
          # Credentials genuinely are CI-only: the migration creates these
          # roles NOLOGIN by design, and the suite must connect AS the
          # runtime role -- running the tenancy tests as superuser would
          # bypass RLS and pass against a schema with no isolation at all.
          psql -h localhost -U postgres -d evercoat_itw_rd -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE evercoat_owner LOGIN PASSWORD 'ci-owner';
          ALTER ROLE evercoat_app   LOGIN PASSWORD 'ci-app';
          -- Sign-in only (I109, migration 053). It holds EXECUTE on two
          -- functions and no table privilege at all; evercoat_app no longer
          -- holds EXECUTE on either, so without this nobody can authenticate.
          ALTER ROLE evercoat_auth  LOGIN PASSWORD 'ci-auth';
          -- Anonymous public reads (migration 059). Created NOLOGIN by the
          -- migration for the same reason as the others; the public surface
          -- tests must connect AS this role, because the property under test
          -- is that THIS ROLE cannot reach a tenant table. Running them as
          -- the owner would pass no matter what 059 granted.
          ALTER ROLE evercoat_public LOGIN PASSWORD 'ci-public';
          -- The agent tier's curation role (migration 060). Its inability to
          -- publish is a property of THIS connection, so the boundary tests
          -- must connect as it; run as the owner they would find no boundary
          -- and report that as passing.
          ALTER ROLE evercoat_agent LOGIN PASSWORD 'ci-agent';
          GRANT CONNECT ON DATABASE evercoat_itw_rd
            TO evercoat_owner, evercoat_app, evercoat_auth, evercoat_public,
               evercoat_agent;
          SQL

      - name: Tests
        working-directory: apps/api
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          POSTGRES_DB: evercoat_itw_rd
          TEST_OWNER_USER: evercoat_owner
          TEST_OWNER_PASSWORD: ci-owner
          APP_DB_USER: evercoat_app
          APP_DB_PASSWORD: ci-app
          # 🔴 THE db FIXTURES BUILD THEIR URL FROM THESE, NOT FROM
          # AUTH_DATABASE_URL. Without them `auth_engine` cannot connect and
          # every sign-in test SKIPS -- which is a suite that ran nothing,
          # reported as green. The job's own "were any tests skipped" guard
          # catches it, and it caught this.
          AUTH_DB_USER: evercoat_auth
          PUBLIC_DB_USER: evercoat_public
          PUBLIC_DB_PASSWORD: ci-public
          AGENT_DB_USER: evercoat_agent
          AGENT_DB_PASSWORD: ci-agent
          AUTH_DB_PASSWORD: ci-auth
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          AUTH_DATABASE_URL: postgresql+psycopg://evercoat_auth:ci-auth@localhost:5432/evercoat_itw_rd
          PUBLIC_DATABASE_URL: postgresql+psycopg://evercoat_public:ci-public@localhost:5432/evercoat_itw_rd
          AGENT_DATABASE_URL: postgresql+psycopg://evercoat_agent:ci-agent@localhost:5432/evercoat_itw_rd
          # 🔴 `tests/db` MUST NOT SKIP IN CI, AND A CONDITIONAL SKIP IS
          # INDISTINGUISHABLE FROM AN UNREACHABLE DATABASE TO THE GUARD
          # BELOW. `test_064_...::test_a_null_owner_is_readable_by_nobody`
          # plants a row the tenant policy refuses to create, which needs
          # the superuser -- so without this it skipped, and the step that
          # exists to catch a silently-not-running tenancy suite failed the
          # build. Correctly: that guard is load-bearing and must not be
          # loosened to accommodate a skip.
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:18080/realms/evercoat
        run: |
          # -rs so SKIPPED tests are named, not just counted. A suite that
          # silently skips its database tests reports green while proving
          # nothing -- results are always passed / failed / SKIPPED.
          pytest -v -rs --tb=short

      - name: Assert tenancy tests actually ran
        working-directory: apps/api
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          POSTGRES_DB: evercoat_itw_rd
          TEST_OWNER_USER: evercoat_owner
          TEST_OWNER_PASSWORD: ci-owner
          APP_DB_USER: evercoat_app
          APP_DB_PASSWORD: ci-app
          # 🔴 THE db FIXTURES BUILD THEIR URL FROM THESE, NOT FROM
          # AUTH_DATABASE_URL. Without them `auth_engine` cannot connect and
          # every sign-in test SKIPS -- which is a suite that ran nothing,
          # reported as green. The job's own "were any tests skipped" guard
          # catches it, and it caught this.
          AUTH_DB_USER: evercoat_auth
          PUBLIC_DB_USER: evercoat_public
          PUBLIC_DB_PASSWORD: ci-public
          AGENT_DB_USER: evercoat_agent
          AGENT_DB_PASSWORD: ci-agent
          AUTH_DB_PASSWORD: ci-auth
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          AUTH_DATABASE_URL: postgresql+psycopg://evercoat_auth:ci-auth@localhost:5432/evercoat_itw_rd
          PUBLIC_DATABASE_URL: postgresql+psycopg://evercoat_public:ci-public@localhost:5432/evercoat_itw_rd
          AGENT_DATABASE_URL: postgresql+psycopg://evercoat_agent:ci-agent@localhost:5432/evercoat_itw_rd
          # 🔴 `tests/db` MUST NOT SKIP IN CI, AND A CONDITIONAL SKIP IS
          # INDISTINGUISHABLE FROM AN UNREACHABLE DATABASE TO THE GUARD
          # BELOW. `test_064_...::test_a_null_owner_is_readable_by_nobody`
          # plants a row the tenant policy refuses to create, which needs
          # the superuser -- so without this it skipped, and the step that
          # exists to catch a silently-not-running tenancy suite failed the
          # build. Correctly: that guard is load-bearing and must not be
          # loosened to accommodate a skip.
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:18080/realms/evercoat
        run: |
          set -euo pipefail
          # The db fixtures skip when no database is reachable. That is
          # right for a laptop and wrong for CI: a misconfigured service
          # container would turn the entire tenancy suite into skips and
          # the job would still be green. Fail if they did not run.
          count=$(pytest tests/db -q --collect-only 2>/dev/null | grep -c "test_" || echo 0)
          if [ "$count" -lt 12 ]; then
            echo "expected >=12 tenancy tests, collected $count"; exit 1
          fi
          pytest tests/db -q --no-header -rs \
            | tee /tmp/db.txt
          if grep -q "skipped" /tmp/db.txt; then
            echo "tenancy tests were SKIPPED -- the database was not reachable"
            exit 1
          fi

      # AN UNRUN SEEDER IS NOT A SEEDER.
      #
      # The same rule this repository already applied to backup.sh, where
      # the restore drill is what made the backup real. `scripts/seed.py`
      # is the only thing that puts demonstration data into a database,
      # it reads the SAME demo-data.json the deployed site renders, and
      # until now nothing ever executed it -- so a schema change could
      # break it and the break would surface on an operator's machine
      # while every gate stayed green.
      #
      # Run LAST, after the tests, deliberately: seeding before them would
      # put rows in front of assertions that were written against an empty
      # database, and a suite that passes only because of seed data is a
      # suite that has stopped saying what it means.
      - name: Seed — run it, twice, and count what it wrote
        working-directory: apps/api
        env:
          SEED_DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          PGPASSWORD: ci-postgres
        run: |
          set -euo pipefail
          python ../../scripts/seed.py

          # TWICE, because the script claims to be idempotent and a claim
          # is not a mechanism. The second run must not raise -- every
          # INSERT carries an ON CONFLICT -- and must not double any row.
          python ../../scripts/seed.py

          # Counted from the database, not from the script's own printed
          # summary. A seeder reporting what it MEANT to write is exactly
          # the "report saying zero is indistinguishable from a broken
          # deploy" shape already recorded against this platform.
          counts=$(psql -h localhost -U postgres -d evercoat_itw_rd -tAF' ' -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM materials.materials),
              (SELECT count(*) FROM materials.suppliers),
              (SELECT count(*) FROM materials.material_documents WHERE document_type = 'SDS'),
              (SELECT count(*) FROM materials.units),
              (SELECT count(*) FROM formulations.formulas),
              (SELECT count(*) FROM formulations.formula_versions),
              (SELECT count(*) FROM formulations.formula_components)")
          echo "materials suppliers sds units formulas versions components = $counts"

          set -- $counts
          materials=$1; suppliers=$2; sds=$3; units=$4
          formulas=$5; versions=$6; components=$7

          # The expected numbers come from demo-data.json, read here rather
          # than hardcoded, so adding a material to the demonstration does
          # not silently fail this gate.
          expected=$(python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("../../apps/web/lib/demo/demo-data.json").read_text(encoding="utf-8"))
          versions = [v for f in d["formulas"] for v in f["versions"]]
          print(len(d["materials"]), len(d["suppliers"]), len(d["formulas"]),
                len(versions), sum(len(v["components"]) for v in versions))
          PY
          )
          set -- $expected
          exp_materials=$1; exp_suppliers=$2; exp_formulas=$3
          exp_versions=$4; exp_components=$5

          fail=0
          check() {
            if [ "$2" -ne "$3" ]; then
              echo "MISMATCH $1: database has $2, demo-data.json has $3"; fail=1
            fi
          }
          check materials  "$materials"  "$exp_materials"
          check suppliers  "$suppliers"  "$exp_suppliers"
          check formulas   "$formulas"   "$exp_formulas"
          check versions   "$versions"   "$exp_versions"
          check components "$components" "$exp_components"

          # EVERY material must carry an SDS. Without one the formulation
          # safety check hard-blocks submission, so a seeded database
          # missing them is a demonstration in which no formula can be
          # submitted -- the exact deadlock this slice's review found.
          check sds "$sds" "$exp_materials"

          if [ "$units" -lt 1 ]; then
            echo "MISMATCH units: Administration section 3 seeded nothing"; fail=1
          fi

          exit "$fail"

  web:
    name: Web — lint, type, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, resolved 2026-08-18
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci || npm install
      - name: Design tokens - computed contrast (WCAG 2.2)
        # Runs BEFORE lint so a contrast regression is the first thing
        # reported. It PARSES packages/design-tokens/src/tokens.css rather
        # than holding its own copy of the palette: a verifier with its own
        # copy is a second source of truth AND a gate that cannot fail, since
        # editing the tokens would leave it checking the old values and still
        # reporting green. Proved by falsification on 2026-08-22 -- reverting
        # PASS green to #16a34a (3.30:1), using the shadcn default border on a
        # control (1.48:1, the exact ratio of the sidebar defect logged on
        # 2026-08-20), and renaming a token each make it exit 1.
        #
        # This exists because axe cannot be relied on here: it reported ZERO
        # violations over a 1.48:1 sidebar, because aria-disabled silences its
        # own contrast rule.
        run: python3 packages/design-tokens/verify_contrast.py

      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        # 17 navigation contract tests. They assert the RBAC filter in
        # BOTH directions -- serving the shell only ever proved that it
        # removes items, which a filter returning nothing would also do.
        run: npm test
      - working-directory: apps/web
        # NODE_ENV=production explicitly: building as development ships
        # the dev React runtime, which behaves differently from what was
        # tested and is slower and larger.
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build the mode the site actually ships in, and assert it
        working-directory: apps/web
        # CI only ever built `standalone`. The DEPLOYED site is the static
        # EXPORT, and the two differ in ways that have already broken the
        # front door once: under `output: "export"` a server `redirect()`
        # emits an error document, and without `trailingSlash` the export
        # writes dashboard.html, which Render 404s because it does no
        # clean-URL fallback.
        #
        # Both guards existed only inside the Render build command — that is,
        # they ran after merge, at deploy time, against whatever had already
        # landed on master. Running them here makes a regression a failed PR
        # instead of a broken production front door.
        env:
          NODE_ENV: production
          NEXT_OUTPUT: export
        run: |
          set -euo pipefail
          npm run build
          if grep -q "__next_error__" out/index.html; then
            echo "::error::/ exported as a Next.js error document — the front door is broken"
            exit 1
          fi
          test -f out/dashboard/index.html || {
            echo "::error::out/dashboard/index.html missing — /dashboard would 404 on a host with no .html fallback"
            exit 1
          }
          test -f out/admin/index.html || {
            echo "::error::out/admin/index.html missing"; exit 1
          }
          echo "static export OK: real root document, directory indexes present"

  e2e:
    name: E2E — browser shell, axe-core, API over HTTP
    runs-on: ubuntu-latest

    # The suite existed and passed locally while CI ran neither Playwright
    # nor axe-core, so every PR could be green without either having
    # executed. `CLAUDE.md` §11 has required axe-core in CI since Slice 1;
    # this job is the first time that requirement is actually enforced
    # rather than merely written down.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evercoat_itw_rd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d evercoat_itw_rd"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, resolved 2026-08-18
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4, resolved 2026-08-18
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: apps/api
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://127.0.0.1:1/realms/evercoat
        run: alembic upgrade head

      - name: Grant the application role a login
        env:
          PGPASSWORD: ci-postgres
        run: |
          set -euo pipefail
          # The API refuses to start as a superuser -- `Settings` validates
          # it, deliberately, because the runtime role is the one FORCE RLS
          # applies to. This job had no such step and pointed the server at
          # `postgres`, so Playwright's webServer died on a pydantic
          # ValidationError before a single test ran and the failure read
          # as a broken E2E suite rather than a misconfigured job.
          #
          # That refusal is worth keeping exactly as it is: it turned a
          # silent "CI tests something production can never be" into a hard
          # stop. The job is what was wrong.
          psql -h localhost -U postgres -d evercoat_itw_rd -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE evercoat_app LOGIN PASSWORD 'ci-app';
          ALTER ROLE evercoat_auth LOGIN PASSWORD 'ci-auth';
          -- The anonymous public read role (059). uvicorn needs it to serve
          -- /api/public/*, which the E2E suite probes without a token.
          ALTER ROLE evercoat_public LOGIN PASSWORD 'ci-public';
          ALTER ROLE evercoat_agent LOGIN PASSWORD 'ci-agent';
          GRANT CONNECT ON DATABASE evercoat_itw_rd
            TO evercoat_app, evercoat_public, evercoat_agent;
          SQL

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Install E2E dependencies
        run: npm ci || npm install

      # `--with-deps` because the GitHub runner lacks the shared libraries
      # Chromium needs. Without it the browser downloads and then fails to
      # launch, which reads as a broken test rather than a missing library.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        env:
          # The RUNTIME role, never `postgres`. Playwright starts the API
          # itself and the API refuses a superuser connection string, so
          # this must match what production actually connects as.
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          AUTH_DATABASE_URL: postgresql+psycopg://evercoat_auth:ci-auth@localhost:5432/evercoat_itw_rd
          PUBLIC_DATABASE_URL: postgresql+psycopg://evercoat_public:ci-public@localhost:5432/evercoat_itw_rd
          AGENT_DATABASE_URL: postgresql+psycopg://evercoat_agent:ci-agent@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://127.0.0.1:1/realms/evercoat
          # CI supplies a real database, so readiness reporting 503 here
          # means something is genuinely broken. Locally the suite tolerates
          # 503 (there may be no database); accepting it in CI too would let
          # a wrong DATABASE_URL leave the run green.
          E2E_REQUIRE_DB_READY: "1"
          CI: "true"
        # --fail-on-flaky-tests: a retry that passes on the second attempt
        # still means the suite is not trustworthy. Without this, `retries`
        # quietly converts an intermittent failure into a green job.
        run: npx playwright test --fail-on-flaky-tests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, resolved 2026-08-18
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  api-image:
    name: API — the deployment artifact actually builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18

      # 🔴 THIS JOB EXISTS BECAUSE THE IMAGE HAD NEVER BUILT, EVER.
      #
      # `apps/api/Dockerfile` is the artifact Render deploys
      # (`render-provision.yml` names it), and NOTHING built it: this workflow
      # runs pytest and uvicorn directly, compose was never brought up on the
      # development host, and the Render service has never been created. So the
      # runtime stage's `pip install --no-index ... -e .` had been failing on a
      # missing build backend for the entire life of the project, and the first
      # thing that would have discovered it is the deploy.
      #
      # Building it here costs a few minutes and converts "the deploy failed at
      # 2am" into a red check on the commit that broke it.
      #
      # ⚠️ BUILD ONLY, DELIBERATELY. Running the container needs a database and
      # an issuer, which `api` and `e2e` already cover against real services.
      # What was missing was proof the IMAGE ASSEMBLES, and that is what this
      # asserts. A `docker run` here would duplicate the other jobs and add a
      # second place for their fixtures to drift.
      - name: Build the API image
        run: docker build -t evercoat-api:ci apps/api

      # A build that produces an image which cannot start is still a broken
      # artifact. This is the cheapest possible liveness proof: no database, no
      # network, just "does the interpreter come up and can it import the app".
      - name: The image can import the application
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg://u:p@127.0.0.1:1/x" \
            -e KEYCLOAK_ISSUER="http://127.0.0.1:1/realms/evercoat" \
            --entrypoint python evercoat-api:ci \
            -c "import app.main; print('app.main imported inside the image')"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18
        with:
          # gitleaks on `push` scans only the pushed commits; full history
          # needs the whole repo, so fetch it.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2, resolved 2026-08-18
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — filesystem
        # 0.28.0 was never a published tag, so this step failed to resolve
        # on every run with "unable to find version" — the scan had never
        # executed once. A security job that cannot start is worse than an
        # absent one: it occupies the slot where the check is supposed to
        # be. Pinned to a tag that exists (verified against the action's
        # releases) rather than a floating ref, so a supply-chain change
        # upstream cannot silently alter what runs here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, resolved 2026-08-18
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # A high-severity finding blocks the merge. The source is
          # explicit that this gates staging deployment.
          exit-code: "1"
          ignore-unfixed: true

      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config auto --error --skip-unknown-extensions .

  auth:
    name: Auth — real Keycloak, real tokens
    runs-on: ubuntu-latest

    # 🔴 THE FIRST TIME AUTHENTICATION HAS EVER RUN.
    #
    # The API has verified tokens correctly since Slice 1 and had never
    # once verified a real one, because no Keycloak had ever run anywhere:
    # not on Render, not in CI, not on the development host. Every auth
    # test until now fabricated its own JWT or mocked the verifier, so the
    # four defects this job exists to catch were all invisible — the realm
    # ships with zero users, the seeder writes placeholder subjects, a
    # Keycloak token's audience is `account` unless a mapper says
    # otherwise, and nothing had ever sent `X-Organization-Id`.
    #
    # This job needs no deployment and costs nothing, which matters:
    # deploying the API and Keycloak is blocked on Render's free
    # web-service quota, and that is the operator's decision, not CI's.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evercoat_itw_rd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d evercoat_itw_rd"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, resolved 2026-08-18

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5, resolved 2026-08-18
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      # Generated, never written down. A hardcoded password in a workflow
      # file is a gitleaks finding whatever the comment beside it says, and
      # the realm's policy (12 chars, mixed case, digit, special) would push
      # anyone writing one by hand toward something they had used before.
      - name: Mint throwaway credentials
        run: |
          set -euo pipefail
          admin="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')Aa1!"
          user="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')Bb2!"
          echo "::add-mask::$admin"
          echo "::add-mask::$user"
          echo "KC_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"
          echo "KC_USER_PASSWORD=$user" >> "$GITHUB_ENV"

      - name: Start Keycloak with the shipped realm
        run: |
          set -euo pipefail
          # `docker run`, not a `services:` block: a service container takes
          # only an image and env, and Keycloak needs BOTH a command
          # (`start-dev --import-realm`) and the realm mounted. A service
          # container would start a Keycloak with no realm at all — which
          # would pass a health check and fail every token request.
          docker run -d --name evercoat-keycloak-ci \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_ADMIN_PASSWORD" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HTTP_ENABLED=true \
            -v "$PWD/services/keycloak/realm:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm

      - name: Apply migrations
        working-directory: apps/api
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:8080/realms/evercoat
        run: alembic upgrade head

      - name: Grant the application role a login
        env:
          PGPASSWORD: ci-postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d evercoat_itw_rd -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE evercoat_app LOGIN PASSWORD 'ci-app';
          ALTER ROLE evercoat_auth LOGIN PASSWORD 'ci-auth';
          -- The anonymous public read role (059). uvicorn needs it to serve
          -- /api/public/*, which the E2E suite probes without a token.
          ALTER ROLE evercoat_public LOGIN PASSWORD 'ci-public';
          ALTER ROLE evercoat_agent LOGIN PASSWORD 'ci-agent';
          GRANT CONNECT ON DATABASE evercoat_itw_rd
            TO evercoat_app, evercoat_public, evercoat_agent;
          SQL

      - name: Seed, and capture the organization the tokens will name
        env:
          SEED_DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
        run: |
          set -euo pipefail
          python scripts/seed.py | tee seed.log
          org="$(grep -oE 'organization: [0-9a-f-]{36}' seed.log | head -1 | awk '{print $2}')" || org=""
          if [ -z "$org" ]; then
            echo "FAIL: the seeder printed no organization id; every request would 400" >&2
            exit 1
          fi
          echo "TEST_ORGANIZATION_ID=$org" >> "$GITHUB_ENV"

      - name: Create the realm's users and bind their subjects
        env:
          KC_URL: http://localhost:8080
          KC_SUBS_OUT: keycloak-subs.json
          SEED_DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
        run: |
          set -euo pipefail
          # The `bash -x` trace that used to be here has been REMOVED, and
          # it did its job: it answered in one run what reading the source
          # had got wrong twice. The abort was a literal \n on the
          # role-mapping call in keycloak-bootstrap.sh, which bash reduced
          # to a bare word `n` and curl read as a SECOND URL -- hence
          # "could not resolve host", exit 6, and a status of 204000,
          # because -w prints once per URL.
          #
          # It is removed rather than left on, deliberately: api_status
          # now names its own failures, and leaving the trace would mask
          # whether that diagnostic actually works. If this step ever
          # dies silently again, THAT is the finding.
          bash scripts/keycloak-bootstrap.sh --with-test-client
          python scripts/keycloak-bind-subs.py keycloak-subs.json

      - name: Start the API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          AUTH_DATABASE_URL: postgresql+psycopg://evercoat_auth:ci-auth@localhost:5432/evercoat_itw_rd
          PUBLIC_DATABASE_URL: postgresql+psycopg://evercoat_public:ci-public@localhost:5432/evercoat_itw_rd
          AGENT_DATABASE_URL: postgresql+psycopg://evercoat_agent:ci-agent@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:8080/realms/evercoat
          KEYCLOAK_AUDIENCE: evercoat-api
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          deadline=$(( SECONDS + 90 ))
          until code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/live)" \
                && [ "$code" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAIL: the API never became live. Its log:" >&2
              cat "$GITHUB_WORKSPACE/api.log" >&2
              exit 1
            fi
            sleep 2
          done

      # 🔴 THE COUNTS, AND THE THIRD STATE.
      #
      # These tests skip themselves when no Keycloak is configured, which
      # is right on a laptop and catastrophic here: a fully skipped run
      # exits 0 and reads as proof. The assertion below is on the number
      # that PASSED and on skipped being zero — never on the exit code.
      - name: Prove authentication end to end
        working-directory: apps/api
        env:
          TEST_KEYCLOAK_URL: http://localhost:8080
          TEST_API_URL: http://127.0.0.1:8000
          TEST_KEYCLOAK_REALM: evercoat
          TEST_KEYCLOAK_CLIENT: evercoat-test
          TEST_KEYCLOAK_PASSWORD: ${{ env.KC_USER_PASSWORD }}
          TEST_ORGANIZATION_ID: ${{ env.TEST_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          # BOTH signals are used. The report answers "did anything
          # actually run?"; the exit code catches a pytest that died
          # before it could write one, or an error outside any test.
          # Codex flagged that `|| true` alone discarded the second.
          rc=0
          pytest tests/integration/test_auth_end_to_end.py -v             --junitxml=auth-results.xml || rc=$?
          python "$GITHUB_WORKSPACE/scripts/assert-suite-ran.py" auth-results.xml
          if [ "$rc" != "0" ]; then
            echo "FAIL: pytest exited $rc" >&2
            exit 1
          fi

      - name: Keycloak and API logs on failure
        if: failure()
        run: |
          echo "=== keycloak ==="; docker logs evercoat-keycloak-ci 2>&1 | tail -80
          echo "=== api ==="; tail -80 "$GITHUB_WORKSPACE/api.log" || true
