name: CI

# All logic lives in scripts/ so the runner stays swappable (ADR-010).
# The source's zero-cost default is Forgejo Actions; GitHub is used as a
# permitted convenience, and moving back means changing this file only.

on:
  push:
    # `master` FIRST because that is this repository's actual default
    # branch. This said `[main]` only, so every push since the repository
    # was created matched nothing and CI never ran once — a workflow
    # gated on a branch that does not exist is indistinguishable from
    # having no CI at all, and it reports nothing while it happens.
    # `main` is kept so a future default-branch rename does not silently
    # switch CI off again.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref. Note that a GitHub concurrency group is a one-slot
  # replacement waiting room, not a queue -- a pending run can be evicted
  # rather than queued. That is fine for CI; it is NOT fine for deploy or
  # migration workflows, which must confirm their run id actually started.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api:
    name: API — lint, type, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, matching the compose stack. Testing against plain
        # postgres would pass and then fail at Slice 8 when the extension
        # is needed (ADR-004).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evercoat_itw_rd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d evercoat_itw_rd"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check . && ruff format --check .

      - name: Type check
        working-directory: apps/api
        run: mypy app

      - name: Apply migrations
        working-directory: apps/api
        env:
          # The OWNER role, not the runtime role. ADR-017 keeps DDL away
          # from the role the application connects with, so these two
          # URLs are deliberately different credentials.
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
        run: |
          set -euo pipefail
          # Alembic, not a loop over *.sql. The loop applied files in
          # glob order with no record of what had run -- acceptable on a
          # throwaway CI database, useless anywhere the schema persists.
          alembic upgrade head
          # Prove version tracking works rather than assume it. A second
          # run must be a no-op; if it re-applies, the version table is
          # not being written and every future deploy would replay the
          # entire history.
          out=$(alembic upgrade head 2>&1)
          if echo "$out" | grep -q "Running upgrade"; then
            echo "alembic re-applied migrations on a second run:"
            echo "$out"
            exit 1
          fi
          alembic current

      - name: Configure test roles
        env:
          PGPASSWORD: ci-postgres
        run: |
          set -euo pipefail
          # The migration creates these NOLOGIN by design. CI grants LOGIN
          # so the suite can connect AS the runtime role -- running the
          # tenancy tests as superuser would bypass RLS entirely and pass
          # against a schema with no isolation at all.
          psql -h localhost -U postgres -d evercoat_itw_rd -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE evercoat_owner LOGIN PASSWORD 'ci-owner';
          ALTER ROLE evercoat_app   LOGIN PASSWORD 'ci-app';
          GRANT CONNECT ON DATABASE evercoat_itw_rd TO evercoat_owner, evercoat_app;
          GRANT CREATE ON SCHEMA core, projects, audit TO evercoat_owner;
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA core, projects, audit TO evercoat_owner;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA audit
            TO evercoat_owner, evercoat_app;
          DO $$
          DECLARE r RECORD;
          BEGIN
            FOR r IN SELECT n.nspname, c.relname FROM pg_class c
                     JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE c.relkind IN ('r','S')
                       AND n.nspname IN ('core','projects','audit')
            LOOP
              EXECUTE format('ALTER TABLE IF EXISTS %I.%I OWNER TO evercoat_owner',
                             r.nspname, r.relname);
            END LOOP;
          END $$;
          SQL

      - name: Tests
        working-directory: apps/api
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          POSTGRES_DB: evercoat_itw_rd
          TEST_OWNER_USER: evercoat_owner
          TEST_OWNER_PASSWORD: ci-owner
          APP_DB_USER: evercoat_app
          APP_DB_PASSWORD: ci-app
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:18080/realms/evercoat
        run: |
          # -rs so SKIPPED tests are named, not just counted. A suite that
          # silently skips its database tests reports green while proving
          # nothing -- results are always passed / failed / SKIPPED.
          pytest -v -rs --tb=short

      - name: Assert tenancy tests actually ran
        working-directory: apps/api
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          POSTGRES_DB: evercoat_itw_rd
          TEST_OWNER_USER: evercoat_owner
          TEST_OWNER_PASSWORD: ci-owner
          APP_DB_USER: evercoat_app
          APP_DB_PASSWORD: ci-app
          DATABASE_URL: postgresql+psycopg://evercoat_app:ci-app@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://localhost:18080/realms/evercoat
        run: |
          set -euo pipefail
          # The db fixtures skip when no database is reachable. That is
          # right for a laptop and wrong for CI: a misconfigured service
          # container would turn the entire tenancy suite into skips and
          # the job would still be green. Fail if they did not run.
          count=$(pytest tests/db -q --collect-only 2>/dev/null | grep -c "test_" || echo 0)
          if [ "$count" -lt 12 ]; then
            echo "expected >=12 tenancy tests, collected $count"; exit 1
          fi
          pytest tests/db -q --no-header -rs \
            | tee /tmp/db.txt
          if grep -q "skipped" /tmp/db.txt; then
            echo "tenancy tests were SKIPPED -- the database was not reachable"
            exit 1
          fi

  web:
    name: Web — lint, type, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci || npm install
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        # 17 navigation contract tests. They assert the RBAC filter in
        # BOTH directions -- serving the shell only ever proved that it
        # removes items, which a filter returning nothing would also do.
        run: npm test
      - working-directory: apps/web
        # NODE_ENV=production explicitly: building as development ships
        # the dev React runtime, which behaves differently from what was
        # tested and is slower and larger.
        env:
          NODE_ENV: production
        run: npm run build

  e2e:
    name: E2E — browser shell, axe-core, API over HTTP
    runs-on: ubuntu-latest

    # The suite existed and passed locally while CI ran neither Playwright
    # nor axe-core, so every PR could be green without either having
    # executed. `CLAUDE.md` §11 has required axe-core in CI since Slice 1;
    # this job is the first time that requirement is actually enforced
    # rather than merely written down.

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evercoat_itw_rd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d evercoat_itw_rd"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: apps/api
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://127.0.0.1:1/realms/evercoat
        run: alembic upgrade head

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Install E2E dependencies
        run: npm ci || npm install

      # `--with-deps` because the GitHub runner lacks the shared libraries
      # Chromium needs. Without it the browser downloads and then fails to
      # launch, which reads as a broken test rather than a missing library.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/evercoat_itw_rd
          KEYCLOAK_ISSUER: http://127.0.0.1:1/realms/evercoat
          # CI supplies a real database, so readiness reporting 503 here
          # means something is genuinely broken. Locally the suite tolerates
          # 503 (there may be no database); accepting it in CI too would let
          # a wrong DATABASE_URL leave the run green.
          E2E_REQUIRE_DB_READY: "1"
          CI: "true"
        # --fail-on-flaky-tests: a retry that passes on the second attempt
        # still means the suite is not trustworthy. Without this, `retries`
        # quietly converts an intermittent failure into a green job.
        run: npx playwright test --fail-on-flaky-tests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks on `push` scans only the pushed commits; full history
          # needs the whole repo, so fetch it.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # A high-severity finding blocks the merge. The source is
          # explicit that this gates staging deployment.
          exit-code: "1"
          ignore-unfixed: true

      - name: Semgrep
        run: |
          pip install semgrep
          semgrep --config auto --error --skip-unknown-extensions .
