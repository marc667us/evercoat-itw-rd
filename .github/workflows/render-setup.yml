# Render setup for EvercoatITWRD APP.
#
# WHY A WORKFLOW AND NOT A LOCAL SCRIPT. The Render API key lives as a GitHub
# Actions secret, exactly as it does for AutoWorkshop. That keeps an
# account-wide credential out of chat logs, out of the developer's shell
# history and out of this repository, and it means every change to the Render
# account is recorded in a run log with a timestamp and an actor.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY THIS CREATES A STATIC SITE AND NOT A DOCKER WEB SERVICE
# ─────────────────────────────────────────────────────────────────────────
#
# Creating a free web service is REFUSED by this account, measured twice, most
# recently in run 32128287996 on 2026-08-18:
#
#     POST /services -> 400
#     {"message":"free tier usage quota has been exhausted,
#       new services are not allowed"}
#
# The account holds five services, ALL on `standard`, none free. The exhausted
# allowance is the workspace's 750 free INSTANCE-hours per month.
#
# Render static sites have no instance, so they do not draw on that allowance
# at all and remain deployable when it is gone
# (https://render.com/docs/free). They are also free of charge, and Render
# issues and renews a TLS certificate for every custom domain automatically,
# at no cost (https://render.com/docs/static-sites). That is exactly what this
# deployment needs, and it is zero-spend by construction.
#
# THE `plan` INPUT HAS BEEN REMOVED. A static site has no instance plan — the
# Render API's staticSiteDetailsPOST schema has no `plan` field at all.
# Removing the input removes the only control on this workflow that could ever
# bill the account. There is now no dispatch of this workflow that costs money.
#
# This is honest for the app as it stands rather than a workaround: `apps/web`
# makes no API calls — no fetch, no next-auth wiring — and has three pages.
# There is no server-side behaviour to lose. That stops being true at Slice 3,
# when the API is wired in; at that point a static host cannot serve the
# product and this must become a web service again, which by then needs either
# restored free instance-hours or a deliberate, operator-approved paid tier.
# `render.yaml` records that target shape.
#
# ─────────────────────────────────────────────────────────────────────────
# 🔴 THIS WORKFLOW TOUCHES A SERVICE BELONGING TO ANOTHER PRODUCT.
# ─────────────────────────────────────────────────────────────────────────
#
# `itwevercoatrd.aiappinvent.com` was once added to `autoworkshop-web` by
# mistake, so Render routed that hostname to AutoWorkshop and issued its
# certificate against that service. Detaching it was the correction and it is
# already done — the step below is now a verified no-op, kept because a guard
# that only ever runs once is a guard nobody can trust afterwards.
# AutoWorkshop is under a standing "do not break it" rule, so the detach step
# is written to be incapable of touching anything else:
#
#   · it addresses the service by ID, never by name search;
#   · it deletes ONE custom domain, matched by exact hostname;
#   · it refuses to run if `autoworkshop.aiappinvent.com` is not still present
#     both before and after — that domain is AutoWorkshop's own front door and
#     losing it is the failure mode worth guarding against;
#   · it never calls suspend, resume, delete, deploy or update on the service.
#
# MODE=plan is READ-ONLY and is the default. It prints exactly what apply would
# do and changes nothing. MODE=apply is gated on `confirm: APPLY` — and a step
# gated on a confirm string that nobody ever supplies is a step that has never
# run, so the plan output states plainly whether it executed.

name: Render setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only) or apply"
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: "Type APPLY to allow writes. Ignored when mode=plan."
        type: string
        default: ""

# One at a time. Two concurrent runs mutating the same Render account would
# interleave in ways the logs could not explain afterwards.
concurrency:
  group: render-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    # A first build, plus DNS verification, plus certificate issuance is
    # minutes rather than seconds. The default 360-minute timeout would let a
    # stuck poll burn an hour before anyone noticed; 45 is generous for the
    # real thing and short enough to fail visibly.
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      # Addressed by ID so no name lookup can drift onto a neighbour.
      AUTOWORKSHOP_WEB_ID: srv-d9ju49id0e5s7389fjlg
      EVERCOAT_DOMAIN: itwevercoatrd.aiappinvent.com
      AUTOWORKSHOP_DOMAIN: autoworkshop.aiappinvent.com
      # 🔴 THE DNS DEPENDS ON THIS EXACT NAME. `itwevercoatrd.aiappinvent.com`
      # is a CNAME to `evercoat-itw-rd-web.onrender.com` in Namecheap. Rename
      # the service and the custom domain still resolves — to a hostname
      # Render no longer serves — and the certificate silently stops renewing.
      # Verified 2026-08-18 by direct DNS query against the authoritative
      # Namecheap nameservers.
      EVERCOAT_SERVICE_NAME: evercoat-itw-rd-web
      REPO_URL: https://github.com/marc667us/evercoat-itw-rd

    steps:
      - name: Guard — key present
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set on this repository."
            echo "Set it with:  gh secret set RENDER_API_KEY -R marc667us/evercoat-itw-rd"
            exit 1
          fi
          echo "mode=$MODE"
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::mode=apply requires confirm=APPLY. Nothing was changed."
            exit 1
          fi

      - name: Run
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, sys, time, urllib.request, urllib.error

          KEY     = os.environ["RENDER_API_KEY"]
          MODE    = os.environ["MODE"]
          AW_ID   = os.environ["AUTOWORKSHOP_WEB_ID"]
          EV_DOM  = os.environ["EVERCOAT_DOMAIN"]
          AW_DOM  = os.environ["AUTOWORKSHOP_DOMAIN"]
          EV_NAME = os.environ["EVERCOAT_SERVICE_NAME"]
          REPO    = os.environ["REPO_URL"]
          APPLY   = MODE == "apply"

          def api(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.render.com/v1{path}", method=method,
                  headers={"Authorization": f"Bearer {KEY}",
                           "Content-Type": "application/json",
                           "Accept": "application/json"},
                  data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      return r.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          def rule(t):
              print(f"\n{'='*74}\n{t}\n{'='*74}", flush=True)

          # ---------------------------------------------------------------
          rule("1. AUTOWORKSHOP-WEB — current custom domains")
          st, doms = api("GET", f"/services/{AW_ID}/custom-domains?limit=50")
          if st != 200:
              print(f"::error::could not read domains ({st}): {doms}"); sys.exit(1)

          rows = [d.get("customDomain", d) for d in doms] if isinstance(doms, list) else []
          names = {r.get("name"): r.get("id") for r in rows}
          for n, i in names.items():
              print(f"   {n}   [{i}]")

          if AW_DOM not in names:
              # Refuse rather than proceed. If AutoWorkshop's own domain is not
              # here, this is not the service we think it is, and deleting
              # anything would be guesswork on a live product.
              print(f"::error::{AW_DOM} is NOT attached to {AW_ID}. Refusing to touch it.")
              sys.exit(1)
          print(f"\n   AutoWorkshop's own domain present: {AW_DOM}  (safe to proceed)")

          # ---------------------------------------------------------------
          rule("2. DETACH the Evercoat domain from AutoWorkshop")
          if EV_DOM not in names:
              print(f"   {EV_DOM} is not attached — nothing to detach.")
          elif not APPLY:
              print(f"   WOULD DELETE custom domain {EV_DOM} [{names[EV_DOM]}] from {AW_ID}")
              print("   (plan mode — nothing changed)")
          else:
              st, resp = api("DELETE", f"/services/{AW_ID}/custom-domains/{names[EV_DOM]}")
              print(f"   DELETE -> {st} {resp if resp else ''}")
              if st not in (200, 204):
                  print("::error::detach failed"); sys.exit(1)
              st, after = api("GET", f"/services/{AW_ID}/custom-domains?limit=50")
              after_names = {(d.get("customDomain", d)).get("name") for d in after}
              print(f"   after: {sorted(n for n in after_names if n)}")
              if AW_DOM not in after_names:
                  print(f"::error::{AW_DOM} disappeared — AutoWorkshop's own domain was lost")
                  sys.exit(1)
              if EV_DOM in after_names:
                  print("::error::the Evercoat domain is still attached"); sys.exit(1)
              print(f"   OK — {EV_DOM} detached, {AW_DOM} intact")

          # ---------------------------------------------------------------
          rule("3. EVERCOAT SERVICE — does it exist?")
          st, svcs = api("GET", "/services?limit=100")
          # api() returns the raw error STRING on a non-2xx, so an
          # unchecked result gets iterated as characters and dies with an
          # AttributeError three lines later. One transient 429 or 500
          # would end the job in a traceback instead of a message. Raised
          # by the Supervisor.
          if st != 200 or not isinstance(svcs, list):
              print(f"::error::could not list services ({st}): {svcs}")
              sys.exit(1)

          # Inventory FIRST, before looking for our own service. When the free
          # web-service quota refused creation, the 400 said the allowance was
          # gone and nothing about what spent it — so the next person re-ran
          # the same POST and got the same 400. Read-only, and printed in BOTH
          # modes: a plan run is exactly when someone needs to see this.
          print("   account inventory:")
          for row in (svcs or []):
              s = row.get("service", row)
              det = s.get("serviceDetails", {}) or {}
              print(
                  f"     {s.get('name'):<28} {s.get('type','?'):<12} "
                  f"plan={det.get('plan','-'):<10} "
                  f"env={det.get('env','-'):<8} "
                  f"suspended={s.get('suspended','?')}"
              )
          print(f"   ({len(svcs or [])} service(s) on this account)")

          existing = None
          for row in (svcs or []):
              s = row.get("service", row)
              if s.get("name") == EV_NAME:
                  existing = s
          print(f"   {EV_NAME}: {'EXISTS ' + existing['id'] if existing else 'does not exist'}")

          # Match on TYPE as well as name before reusing anything.
          #
          # Everything below this point assumes the service it found is the
          # free static site this workflow creates. If some earlier attempt had
          # left a `web_service` under the same name, reusing it would attach
          # the production domain to a service on a BILLED instance plan and
          # report success — the operator's zero-spend rule broken silently, by
          # a workflow whose whole point is that it cannot spend. Render service
          # types are immutable, so the only safe response is to stop and say
          # so. Raised by Codex on review.
          if existing and existing.get("type") != "static_site":
              print(f"::error::{EV_NAME} exists but is type "
                    f"'{existing.get('type')}', not 'static_site'. Refusing to "
                    f"reuse it — attaching the domain to it could bill the "
                    f"account. Render service types cannot be changed; delete "
                    f"it deliberately or pick another name.")
              sys.exit(1)

          # The build command carries the front door's only guard.
          #
          # `app/page.tsx` used to be `redirect("/dashboard")`, which under
          # `output: "export"` emitted `<html id="__next_error__">` as
          # out/index.html while `next build` exited 0 and printed
          # "✓ Exporting (2/2)". A Render route cannot rescue that: Render's
          # own documentation states it "does not apply redirect or rewrite
          # rules to a path if a resource exists at that path", and
          # out/index.html exists. The page is now a real client-side redirect,
          # and THIS assertion is what stops that silently reverting — it fails
          # the build rather than publishing an error document as the home page.
          created_now = False

          # One list, used by BOTH create and reconcile. Held here because
          # the create payload having NODE_ENV while the reconcile PATCH
          # did not is exactly how the RUNNING service ended up unpinned
          # while this file claimed otherwise. Raised by Codex.
          ENV_VARS = [
              # Matches ci.yml's NODE_VERSION exactly. An unpinned Node means
              # the build that passed CI is not the build Render runs, and the
              # difference only shows at deploy time.
              {"key": "NODE_VERSION", "value": "22"},
              # NODE_ENV IS DELIBERATELY NOT HERE. It belongs to the BUILD
              # step, not to the service.
              #
              # A service-level NODE_ENV=production applies to `npm ci` as
              # well, and npm reads it as `omit=dev` — so typescript,
              # tailwindcss, postcss and autoprefixer, all devDependencies,
              # are never installed and the Next build dies. Measured:
              # setting it here turned deploy dep-da24cre1egvs7399teqg into
              # `build_failed`. This is exactly why ci.yml sets NODE_ENV on
              # its build step and not on its install step. It is applied
              # inline in BUILD_CMD instead.
              {"key": "NEXT_TELEMETRY_DISABLED", "value": "1"},
          ]

          # Hoisted so the create payload and the reconcile PATCH cannot
          # drift apart — one list, used twice.
          ROUTES = [
              {"type": "rewrite", "source": "/dashboard",
               "destination": "/dashboard/index.html"},
              {"type": "rewrite", "source": "/admin",
               "destination": "/admin/index.html"},
          ]

          BUILD_CMD = (
              "npm ci"
              # NODE_ENV inline, on the BUILD only. It must NOT be set for
              # `npm ci` above, which would read it as omit=dev and skip
              # every devDependency the build needs. Building as development
              # ships the DEVELOPMENT React runtime, so it must be set here.
              " && NEXT_OUTPUT=export NODE_ENV=production npm run build"
              ' && if grep -q "__next_error__" out/index.html;'
              ' then echo "FATAL: / exported as a Next.js error document"; exit 1; fi'
              ' && test -f out/dashboard/index.html'
              ' && test -f out/admin/index.html'
          )

          if not existing:
              st, owners = api("GET", "/owners?limit=10")
              owner_id = (owners[0].get("owner", owners[0])).get("id") if owners else None
              print(f"   ownerId: {owner_id}")

              payload = {
                  "type": "static_site",
                  "name": EV_NAME,
                  "ownerId": owner_id,
                  "repo": REPO,
                  "branch": "master",
                  "autoDeploy": "yes",
                  # The Next app is a sub-directory and carries its own
                  # package-lock.json, so `npm ci` resolves against the right
                  # tree. The repository root holds a SECOND lockfile for the
                  # Playwright suite; building from the root installs that one
                  # and never builds the web app at all.
                  "rootDir": "apps/web",
                  "serviceDetails": {
                      "buildCommand": BUILD_CMD,
                      # Relative to rootDir. `next build` with output:"export"
                      # writes apps/web/out.
                      "publishPath": "out",
                      # Pinned ON rather than left to default.
                      # `itwevercoatrd.aiappinvent.com` is a CNAME to
                      # evercoat-itw-rd-web.onrender.com; disabling the Render
                      # subdomain destroys the target of that CNAME and the
                      # custom domain stops resolving.
                      "renderSubdomainPolicy": "enabled",
                      # Extension-less paths, made explicit rather than assumed.
                      #
                      # Render does NOT do clean-URL fallback — its docs say it
                      # serves the resource at a path if one exists, and there
                      # is no implicit ".html" lookup. The export now writes
                      # directory indexes (out/dashboard/index.html), so every
                      # link the app generates is "/dashboard/" and works
                      # without any rule at all.
                      #
                      # These rules exist for the OTHER case: someone typing or
                      # bookmarking "/dashboard" with no trailing slash. No
                      # resource exists at exactly that path, which is precisely
                      # the condition under which Render applies a rule, so the
                      # rewrite fires deterministically instead of relying on
                      # the host to invent a directory redirect.
                      "routes": ROUTES,
                  },
                  "envVars": ENV_VARS,
              }
              if not APPLY:
                  print("   WOULD CREATE (static site — free, no instance plan):")
                  print(json.dumps(payload, indent=2))
              else:
                  st, resp = api("POST", "/services", payload)
                  print(f"   POST /services -> {st}")
                  if st not in (200, 201):
                      print(f"::error::create failed: {resp}")
                      sys.exit(1)
                  svc = resp.get("service", resp)
                  existing = svc
                  created_now = True
                  print(f"   created: {svc.get('id')}")

          # RECONCILE an existing service instead of silently skipping it.
          #
          # This workflow used to be create-only: BUILD_CMD, routes,
          # publishPath and the env vars were all built and then used ONLY
          # inside `if not existing`. On every run after the first, nothing
          # was applied and no deploy was triggered — yet the deploy poll
          # below found the PREVIOUS deploy already `live`, passed on its
          # first iteration, and the run reported "APPLIED … certificate
          # valid" having changed absolutely nothing. Editing the build
          # assertion or a rewrite rule here would have had no effect on the
          # running service, with a green run each time. Raised by the
          # Supervisor.
          elif APPLY:
              rule("3b. RECONCILE the existing service to this file")
              patch = {
                  "autoDeploy": "yes",
                  "serviceDetails": {
                      "buildCommand": BUILD_CMD,
                      "publishPath": "out",
                      "renderSubdomainPolicy": "enabled",
                      "routes": ROUTES,
                  },
              }
              st, resp = api("PATCH", f"/services/{existing['id']}", patch)
              print(f"   PATCH /services/{existing['id']} -> {st}")
              if st not in (200, 201):
                  print(f"::error::could not reconcile the service: {resp}")
                  sys.exit(1)
              print("   build command, publish path and routes reapplied")

              # Environment variables are a SEPARATE endpoint — PATCH
              # /services does not carry them. The service was created
              # before NODE_ENV was added to this file, so the running
              # service was left unpinned while the file said it was
              # pinned. Raised by Codex.
              #
              # This is a WHOLE-SET PUT: it replaces every variable on the
              # service, so anything added by hand in the dashboard is
              # deleted. That is acceptable here only because this service
              # is created and owned entirely by this workflow and has
              # never held a hand-entered value. The before/after is
              # printed so a lost variable is visible in the run log rather
              # than discovered later.
              st, before = api("GET", f"/services/{existing['id']}/env-vars?limit=50")
              if st == 200 and isinstance(before, list):
                  print(f"   env before: {sorted((e.get('envVar', e) or {}).get('key','?') for e in before)}")
              st, resp = api("PUT", f"/services/{existing['id']}/env-vars", ENV_VARS)
              print(f"   PUT env-vars -> {st}")
              if st not in (200, 201):
                  print(f"::error::could not reconcile env vars: {resp}")
                  sys.exit(1)
              st, after = api("GET", f"/services/{existing['id']}/env-vars?limit=50")
              if st == 200 and isinstance(after, list):
                  keys = sorted((e.get("envVar", e) or {}).get("key", "?") for e in after)
                  print(f"   env after : {keys}")
                  missing = {v["key"] for v in ENV_VARS} - set(keys)
                  if missing:
                      print(f"::error::env vars missing after PUT: {sorted(missing)}")
                      sys.exit(1)

          # ---------------------------------------------------------------
          rule("4. ATTACH the domain to the Evercoat service")
          ev_id = existing["id"] if existing else None
          dom_id = None
          if not ev_id:
              print("   (no service yet — plan mode, or creation skipped)")
          else:
              st, cur = api("GET", f"/services/{ev_id}/custom-domains?limit=50")
              cur_rows = {(d.get("customDomain", d)).get("name"):
                          (d.get("customDomain", d)).get("id")
                          for d in (cur or [])}
              if EV_DOM in cur_rows:
                  dom_id = cur_rows[EV_DOM]
                  print(f"   {EV_DOM} already attached to {ev_id}  [{dom_id}]")
              elif not APPLY:
                  print(f"   WOULD ATTACH {EV_DOM} to {ev_id}")
              else:
                  st, resp = api("POST", f"/services/{ev_id}/custom-domains", {"name": EV_DOM})
                  print(f"   POST custom-domain -> {st} {resp if st >= 400 else ''}")
                  if st not in (200, 201):
                      print("::error::attach failed"); sys.exit(1)
                  # Re-LIST rather than trust the create response shape.
                  #
                  # POST /custom-domains returns an ARRAY of custom-domain
                  # objects, not a single object. Reading it as a dict left
                  # dom_id as None, and step 5 then skipped DNS verification
                  # while printing nothing that looked wrong — a silent skip in
                  # the one step that makes the certificate happen. Listing the
                  # domains back reads the same field the same way as the
                  # already-attached branch above, so there is one shape to get
                  # right instead of two. Raised by Codex on review.
                  st, back = api("GET", f"/services/{ev_id}/custom-domains?limit=50")
                  for item in (back or []):
                      cd = item.get("customDomain", item)
                      if cd.get("name") == EV_DOM:
                          dom_id = cd.get("id")
                  if not dom_id:
                      print(f"::error::attached {EV_DOM} but could not read its id back")
                      sys.exit(1)
                  print(f"   OK — {EV_DOM} attached to {ev_id}  [{dom_id}]")

          # ---------------------------------------------------------------
          # From here on, everything is PROOF rather than configuration.
          #
          # The previous version of this workflow stopped at "attached" and
          # reported success. Attached is not served, and served is not
          # certificated — the operator's browser refused the site with a TLS
          # handshake failure while every recorded step had "succeeded".
          # ---------------------------------------------------------------
          rule("5. DNS VERIFICATION for the custom domain")
          if not (APPLY and ev_id and dom_id):
              print("   (skipped — plan mode, or no domain id)")
          else:
              # Render verifies automatically on attach; this only forces a
              # re-check, which matters here because the CNAME was created long
              # before the service existed.
              st, _ = api("POST", f"/services/{ev_id}/custom-domains/{dom_id}/verify")
              print(f"   POST verify -> {st}")
              verified = False
              for attempt in range(20):          # 20 x 15s = up to 5 minutes
                  st, d = api("GET", f"/services/{ev_id}/custom-domains/{dom_id}")
                  cd = d.get("customDomain", d) if isinstance(d, dict) else {}
                  status = cd.get("verificationStatus")
                  print(f"   [{attempt + 1:02d}] verificationStatus={status}")
                  if status == "verified":
                      verified = True
                      break
                  time.sleep(15)
              if not verified:
                  # Deliberately not fatal. Render can serve and certificate a
                  # domain whose reported status lags, and the HTTPS probe in
                  # step 7 is the real test. Failing here would hide that
                  # answer behind a status field.
                  print("::warning::domain not reported verified within 5 minutes — "
                        "continuing to the HTTPS proof, which is the real test")

          # ---------------------------------------------------------------
          rule("6. WAIT for the deploy to go LIVE")
          if not (APPLY and ev_id):
              print("   (skipped — plan mode)")
          else:
              # Identify EXACTLY which deploy we are waiting for.
              #
              # Polling "the most recent deploy" is how a run that changed
              # nothing still passes: the previous deploy is already `live`,
              # so the very first poll succeeds and the workflow reports a
              # successful deployment of code it never deployed.
              target = None
              if created_now:
                  # Creation triggers the first deploy itself.
                  st, deps = api("GET", f"/services/{ev_id}/deploys?limit=1")
                  if st == 200 and isinstance(deps, list) and deps:
                      target = (deps[0].get("deploy", deps[0])).get("id")
              else:
                  st, resp = api("POST", f"/services/{ev_id}/deploys",
                                 {"clearCache": "do_not_clear"})
                  print(f"   POST /deploys -> {st}")
                  if st not in (200, 201):
                      print(f"::error::could not trigger a deploy: {resp}")
                      sys.exit(1)
                  target = (resp.get("deploy", resp) if isinstance(resp, dict) else {}).get("id")

              if not target:
                  print("::error::could not determine which deploy to wait for")
                  sys.exit(1)
              print(f"   waiting on deploy {target}")

              live = False
              last = None
              for attempt in range(60):          # 60 x 20s = up to 20 minutes
                  st, d = api("GET", f"/services/{ev_id}/deploys/{target}")
                  if st != 200 or not isinstance(d, dict):
                      # A transient error is not a verdict. Log it and keep
                      # polling rather than ending the job on one bad reply.
                      print(f"   [{attempt + 1:02d}] deploy read failed ({st}) — retrying")
                      time.sleep(20)
                      continue
                  d = d.get("deploy", d)
                  last = d.get("status")
                  print(f"   [{attempt + 1:02d}] deploy={target} status={last}")
                  if last == "live":
                      live = True
                      break
                  # Terminal failures. Continuing to poll would burn 20 minutes
                  # to report the same thing.
                  if last in ("build_failed", "update_failed", "canceled",
                              "pre_deploy_failed"):
                      print(f"::error::deploy ended in {last} — read the Render build log")
                      sys.exit(1)
                  time.sleep(20)
              if not live:
                  print(f"::error::deploy did not reach live within 20 minutes (last={last})")
                  sys.exit(1)
              print("   deploy is LIVE")

          # ---------------------------------------------------------------
          rule("7. PROOF — certificate and HTTP response")
          if not (APPLY and ev_id):
              print("   (skipped — plan mode)")
          else:
              # urllib validates the certificate chain against the system trust
              # store by default. A hostname whose certificate has not been
              # issued raises SSLCertVerificationError here — which is exactly
              # the failure the operator's browser reported as "not secure". So
              # a 200 through this call IS the certificate proof, and nothing
              # else in this workflow can stand in for it.
              def probe(url):
                  req = urllib.request.Request(url, headers={"User-Agent": "render-setup"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read(4000).decode("utf-8", "replace")

              ok = False
              for attempt in range(30):          # 30 x 20s = up to 10 minutes
                  try:
                      code, _ = probe(f"https://{EV_DOM}/dashboard")
                      print(f"   [{attempt + 1:02d}] https://{EV_DOM}/dashboard -> {code}")
                      if code == 200:
                          ok = True
                          break
                  except ssl.SSLError as e:
                      print(f"   [{attempt + 1:02d}] TLS not ready yet: {e}")
                  except Exception as e:                       # noqa: BLE001
                      print(f"   [{attempt + 1:02d}] not ready: {type(e).__name__}: {e}")
                  time.sleep(20)

              if not ok:
                  print(f"::error::https://{EV_DOM}/dashboard never returned 200 — "
                        "certificate not issued, or the site is not serving")
                  sys.exit(1)

              # The front door specifically. A green build published an error
              # document here once already; this is the assertion that would
              # have caught it from the outside.
              #
              # Wrapped, because urlopen RAISES on 4xx/5xx rather than
              # returning the code — so the "did not return 200" branch below
              # was unreachable for the exact case it was written for, and a
              # 404 at the front door would have ended the job in a Python
              # traceback. Raised by the Supervisor.
              try:
                  code, body = probe(f"https://{EV_DOM}/")
              except urllib.error.HTTPError as e:
                  print(f"::error::the root returned HTTP {e.code}"); sys.exit(1)
              except Exception as e:                       # noqa: BLE001
                  print(f"::error::the root could not be fetched: "
                        f"{type(e).__name__}: {e}")
                  sys.exit(1)
              print(f"   https://{EV_DOM}/ -> {code}")
              if code != 200:
                  print("::error::the root did not return 200"); sys.exit(1)
              if "__next_error__" in body:
                  print("::error::the root is serving a Next.js ERROR DOCUMENT"); sys.exit(1)
              print("   root is a real page (no __next_error__), certificate valid")

          rule("SUMMARY")
          print(f"   mode      : {MODE}")
          print(f"   changes   : {'APPLIED' if APPLY else 'NONE (plan only)'}")
          print(f"   service   : {EV_NAME} [{ev_id or 'not created'}]")
          print(f"   domain    : {EV_DOM}")
          if APPLY and ev_id:
              print(f"   URL       : https://{EV_DOM}/")
          PY
